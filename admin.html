<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抽籤管理後台</title><link rel="stylesheet" href="style.css"></head><body><main><h1>⚙️ 抽籤管理後台</h1><p>統一管理兩種抽籤模式</p><section class="card" id="login"><h2>管理員登入</h2><label>電子郵件</label><input type="email" id="email"><label>密碼</label><input type="password" id="password"><button id="signin">登入</button><p id="loginmsg" class="error"></p></section><div id="panel" class="hidden"><section class="card"><div class="row"><h2>抽籤設定</h2><button class="secondary" id="signout">登出</button></div><p id="state"></p><label>活動名稱</label><input id="title" maxlength="100" placeholder="例如：小組長抽籤"><label>抽籤模式</label><select id="mode"><option value="order">模式一：抽順序</option><option value="group">模式二：分配組別</option></select><div id="orderSettings"><label>參與人數（1～1000）</label><input type="number" id="people" min="1" max="1000" value="20"></div><div id="groupSettings" class="hidden"><h3>組別與各組人數</h3><div id="groups"></div><button class="secondary" id="addGroup">＋ 新增組別</button><p class="muted small">總人數由各組名額加總，最多 1000 人。</p></div><hr><button id="save">儲存設定（尚不開放）</button><button id="open">開放抽籤</button><button id="close" class="secondary">暫停抽籤</button><button id="reset" class="danger">建立新一輪並清空舊結果</button><p id="msg"></p></section><section class="card"><h2>目前抽籤狀態</h2><p id="summary"></p><h3>本輪結果</h3><div id="results"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="common.js"></script><script src="admin.js"></script></body></html>
